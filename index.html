<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POWER">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<title>POWER</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--sf:#141414;--sf2:#1e1e1e;--bd:#2a2a2a;
  --y:#c8ff00;--r:#ff4520;--b:#00b4ff;--am:#ff9a00;
  --tx:#ffffff;--dim:#888888;
  --nav:64px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;overflow:hidden}
button{-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-appearance:none;appearance:none}

/* ── SCREENS ── */
.screen{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  background:var(--bg);scrollbar-width:none;
  display:none;
  padding-top:var(--st);
  padding-bottom:calc(var(--nav) + var(--sb) + 8px);
  -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}

.detail-screen{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  background:var(--bg);scrollbar-width:none;
  display:none;
  padding-bottom:calc(var(--nav) + var(--sb) + 8px);
  -webkit-overflow-scrolling:touch;
  z-index:10;
}
.detail-screen::-webkit-scrollbar{display:none}
.detail-screen.active{display:block}

/* ── BOTTOM NAV ── */
#nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--nav) + var(--sb));
  padding-bottom:var(--sb);
  background:var(--sf);border-top:1px solid var(--bd);
  display:flex;align-items:stretch;z-index:100;
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;color:var(--dim);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:8px;transition:color .15s;
}
.nb.on{color:var(--y)}
.nb svg{width:22px;height:22px}

/* ── TYPOGRAPHY ── */
h1,.cond{font-family:'Barlow Condensed',sans-serif}

/* ── WEEK SCREEN ── */
.wk-head{padding:16px 16px 12px}
.wk-head h1{font-size:40px;font-weight:900;letter-spacing:.04em;color:var(--y);line-height:1}
.wk-sub{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

.wk-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--sf);
  border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
}
.wk-arr{
  width:38px;height:38px;background:var(--sf2);border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.wk-arr:disabled{opacity:.25;cursor:default}
.wk-lbl{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.04em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd)}
.stat{background:var(--sf);padding:12px 6px;text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--y);line-height:1}
.stat-l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

/* 4-column grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}

.dc{
  background:var(--sf);border:1px solid var(--bd);border-radius:10px;
  padding:10px 8px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .2s,transform .1s;
  -webkit-tap-highlight-color:transparent;
  min-height:90px;
}
.dc:active{transform:scale(.96)}
.dc.done{border-color:var(--y)}
.dc.done::after{content:'✓';position:absolute;top:6px;right:7px;color:var(--y);font-size:13px;font-weight:700}
.dc.partial{border-color:var(--am)}
.dc.partial::after{content:'~';position:absolute;top:6px;right:7px;color:var(--am);font-size:13px;font-weight:700}
.dc.today:not(.done):not(.partial){border-color:var(--b)}
.dc.today .dc-dow{color:var(--b)}
.dc.rest{opacity:.4;cursor:default;pointer-events:none}
.dc.rest:active{transform:none}
.dc-dow{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.dc-n{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.dc-t{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;margin-top:3px;line-height:1.25;padding-right:14px}
.dc-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}

.tag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.ts{background:rgba(255,69,32,.18);color:var(--r)}
.tc{background:rgba(0,180,255,.18);color:var(--b)}
.tp{background:rgba(200,255,0,.18);color:var(--y)}
.tr{background:rgba(136,136,136,.15);color:var(--dim)}
.tm{background:rgba(136,136,136,.15);color:var(--dim)}


/* ── DETAIL HEADER ── */
.det-head{
  padding:calc(var(--st) + 10px) 16px 12px;
  background:var(--sf);border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:20;
}
.back{
  display:flex;align-items:center;gap:5px;background:none;border:none;
  color:var(--y);cursor:pointer;font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:0;margin-bottom:8px;
}
.det-num{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.det-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;line-height:1.1;margin-top:2px}

/* ── PHASE BANNER ── */
.phase{
  margin:12px 16px;
  background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.25);
  border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;
}
.phase-dot{width:8px;height:8px;border-radius:50%;background:var(--y);flex-shrink:0}
.phase-txt{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.phase-txt b{color:var(--y)}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sdot.strength,.sdot.power{background:var(--r)}
.sdot.cardio,.sdot.emom,.sdot.tabata{background:var(--b)}
.sdot.accessory,.sdot.core,.sdot.options,.sdot.mobility{background:var(--dim)}
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ── EXERCISE ROW ── */
.ex-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.ex-row:last-of-type{border-bottom:none}
.chk{
  width:22px;height:22px;border:2px solid var(--bd);border-radius:6px;
  background:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:all .15s;
}
.chk.on{background:var(--y);border-color:var(--y)}
.chk.on::after{content:'✓';color:var(--bg);font-size:12px;font-weight:700}
.ex-info{flex:1;min-width:0}
.ex-nm{font-size:14px;font-weight:500;line-height:1.3}
.ex-nm.done{text-decoration:line-through;color:var(--dim)}
.ex-mt{font-size:11px;color:var(--dim);margin-top:2px}
.ex-np{font-size:11px;color:var(--y);margin-top:3px;font-style:italic}
.notebtn{
  width:32px;height:32px;background:none;border:1px solid var(--bd);
  border-radius:8px;color:var(--dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.notebtn.has{border-color:var(--y);color:var(--y)}

/* ── PROGRAM NOTE ── */
.pnote{
  margin:4px 16px 12px;
  background:var(--sf2);border-left:3px solid var(--y);
  border-radius:0 8px 8px 0;padding:10px 12px;
  font-size:12px;color:var(--dim);line-height:1.55;
}

/* ── SESSION NOTE ── */
.sn-wrap{padding:12px 16px}
.sn-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.sn-ta{
  width:100%;background:var(--sf);border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:13px;padding:10px 12px;resize:none;height:76px;outline:none;
}
.sn-ta:focus{border-color:var(--y)}

/* ── LOG BUTTON ── */
.logwrap{padding:12px 16px 8px}
.logbtn{
  width:100%;background:var(--y);color:var(--bg);border:none;
  border-radius:10px;padding:16px;font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;
}
.logbtn:active{opacity:.75}
.logbtn.logged{background:var(--sf2);color:var(--y);border:1px solid var(--y)}
.logbtn.partial{background:var(--sf2);color:var(--am);border:1px solid var(--am)}

/* ── REST DAY ── */
.rest-card{padding:40px 16px;text-align:center;color:var(--dim)}
.rest-icon{font-size:56px;margin-bottom:14px}
.rest-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--tx)}
.rest-sub{font-size:13px;margin-top:6px}

/* ── NOTE BOTTOM SHEET ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:200;display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
.sheet{
  width:100%;max-width:480px;background:var(--sf);
  border-radius:16px 16px 0 0;
  padding:20px 16px calc(var(--sb) + 20px);
}
.sh-handle{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}
.sh-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em;margin-bottom:10px}
.sh-in{
  width:100%;background:var(--sf2);border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:14px;padding:12px;resize:none;height:84px;outline:none;
}
.sh-in:focus{border-color:var(--y)}
.sh-row{display:flex;gap:8px;margin-top:12px}
.sh-cancel{
  flex:1;padding:12px;background:none;border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.04em;
}
.sh-save{
  flex:2;padding:12px;background:var(--y);border:none;
  border-radius:8px;color:var(--bg);font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.04em;
}

/* ── PROGRESS SCREEN ── */
.pg-head{padding:16px 16px 12px}
.pg-head h1{font-size:40px;font-weight:900;letter-spacing:.04em;color:var(--y);line-height:1}
.pg-sub{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.sec-title{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 16px 8px;
}

/* Heatmap — 7 cols */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px 16px}
.hc{
  aspect-ratio:1;border-radius:4px;background:var(--sf);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-weight:600;
}
.hc.done{background:var(--y);border-color:var(--y);color:var(--bg)}
.hc.partial{background:var(--am);border-color:var(--am);color:var(--bg)}
.hc.hc-tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hc.hc-tap:active{opacity:.6}
.hc.hc-lbl{background:none;border:none;font-size:9px;color:var(--dim)}

/* Log sections */
.ls{margin:0 16px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ls-head{padding:10px 14px 8px;border-bottom:1px solid var(--bd)}
.ls-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em}
.ls-unit{font-size:10px;color:var(--dim);margin-left:5px}
.ls-row{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--bd);align-items:center}
.li{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:14px;padding:7px 9px;outline:none;width:75px}
.li:focus{border-color:var(--y)}
.ln{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:14px;padding:7px 9px;outline:none}
.ln:focus{border-color:var(--y)}
.ladd{background:var(--y);color:var(--bg);border:none;border-radius:6px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;letter-spacing:.04em}
.le{display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid var(--bd);gap:8px}
.le:last-child{border-bottom:none}
.le-v{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--y);min-width:46px}
.le-u{font-size:10px;color:var(--dim);font-weight:400}
.le-d{font-size:11px;color:var(--dim);min-width:58px}
.le-n{font-size:11px;color:var(--dim);flex:1;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldel{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;font-size:18px;line-height:1}
.ldel:hover{color:var(--r)}
.le-empty{padding:10px 14px;font-size:12px;color:var(--dim)}
.le-scroll{max-height:168px;overflow-y:auto;scrollbar-width:none}
.le-scroll::-webkit-scrollbar{display:none}
.divider{height:1px;background:var(--bd);margin:8px 0}
.px16{padding-left:16px;padding-right:16px}

/* ── PROGRAMS SCREEN ── */
.prog-head{padding:16px 16px 12px}
.prog-head h1{font-size:40px;font-weight:900;letter-spacing:.04em;color:var(--y);line-height:1}
.prog-sub{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

.pc{
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:14px 14px 12px;margin:0 16px 10px;
  cursor:pointer;transition:border-color .2s;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.pc:active{opacity:.85}
.pc.active-prog{border-color:var(--y);cursor:default}
.pc.active-prog:active{opacity:1}
.pc-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.04em;padding-right:60px}
.pc-note{font-size:11px;color:var(--b);margin-top:2px;line-height:1.4}
.pc-stats{font-size:11px;color:var(--dim);margin-top:4px}
.pc-badge{
  position:absolute;top:12px;right:12px;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  color:var(--bg);background:var(--y);padding:2px 7px;border-radius:4px;
  letter-spacing:.08em;text-transform:uppercase;
}
.pc-foot{display:flex;gap:8px;margin-top:12px}
.pc-edit-btn{
  padding:8px 14px;background:none;border:1px solid var(--bd);border-radius:8px;
  color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-size:13px;
  font-weight:600;cursor:pointer;letter-spacing:.04em;min-height:36px;
}
.pc-edit-btn:active{border-color:var(--y);color:var(--y)}
.pc-del-btn{
  padding:8px 14px;background:none;border:1px solid var(--bd);border-radius:8px;
  color:var(--r);font-family:'Barlow Condensed',sans-serif;font-size:13px;
  font-weight:600;cursor:pointer;letter-spacing:.04em;min-height:36px;
}

/* ── PROGRAM EDITOR SHEET ── */
.prog-sheet{
  position:fixed;inset:0;
  background:var(--bg);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:300;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 80px);
}
.prog-sheet::-webkit-scrollbar{display:none}
.prog-sheet.open{transform:translateY(0)}

.ps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:4px}
.ps-title-txt{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:.04em}
.ps-close{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--dim);cursor:pointer;font-size:20px;line-height:1;padding:6px 10px;min-height:36px;min-width:36px}
.ps-field{margin-bottom:16px}
.ps-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.ps-in{
  width:100%;background:var(--sf);border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:15px;padding:11px 12px;outline:none;
}
.ps-in:focus{border-color:var(--y)}

.ps-day{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ps-day-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);background:var(--sf2)}
.ps-day-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--y)}
.ps-day-rest-lbl{font-size:11px;color:var(--dim)}
.ps-day-body{padding:10px 12px}
.ps-ti{
  width:100%;background:var(--sf2);border:1px solid var(--bd);
  border-radius:6px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:13px;padding:8px 10px;outline:none;margin-bottom:8px;
}
.ps-ti:focus{border-color:var(--y)}
.ps-type-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ps-type{
  padding:5px 10px;border:1px solid var(--bd);border-radius:6px;
  background:none;color:var(--dim);font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.05em;cursor:pointer;min-height:30px;
}
.ps-type.on{border-color:var(--y);color:var(--y);background:rgba(200,255,0,.08)}
.ps-ex-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ps-ex-n{
  flex:1;background:var(--sf2);border:1px solid var(--bd);
  border-radius:6px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:12px;padding:8px 9px;outline:none;min-height:36px;
}
.ps-ex-n:focus{border-color:var(--y)}
.ps-ex-sr{
  width:72px;background:var(--sf2);border:1px solid var(--bd);
  border-radius:6px;color:var(--tx);font-family:'Barlow',sans-serif;
  font-size:12px;padding:8px 9px;outline:none;min-height:36px;
}
.ps-ex-sr:focus{border-color:var(--y)}
.ps-ex-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:4px;line-height:1;min-height:36px;min-width:28px}
.ps-add-ex{
  width:100%;padding:9px;background:none;border:1px dashed var(--bd);
  border-radius:6px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.04em;margin-top:4px;min-height:36px;
}

.rest-banner{
  position:fixed;bottom:calc(var(--nav) + var(--sb));left:0;right:0;
  background:var(--sf2);border-top:2px solid var(--y);
  padding:10px 16px;z-index:150;

// ── STORAGE ──────────────────────────────────────────
const ls=(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}};
const ss=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

// ── PROGRAM MANAGEMENT ────────────────────────────────
function initPrograms(){
  const OLD_IDS=['power_default','wrist_default'];
  let progs=ls('power_programs')||[];
  // Remove old built-in programs, keep any user-created ones
  progs=progs.filter(p=>!OLD_IDS.includes(p.id));
  // Always refresh built-in data from source code so new fields propagate
  const tpIdx=progs.findIndex(p=>p.id==='training_plan');
  if(tpIdx>=0){progs[tpIdx]=makeTrainingPlanProg();}else{progs.unshift(makeTrainingPlanProg());}
  if(!progs.find(p=>p.id==='flat_feet_fix')){progs.push(makeFlatFeetProg());}
  ss('power_programs',progs);
  // Fix active program if it pointed at a now-removed program
  const activeId=localStorage.getItem('power_active_program');
  if(!activeId||OLD_IDS.includes(activeId)||!progs.find(p=>p.id===activeId)){
    localStorage.setItem('power_active_program','training_plan');
  }
}

function getPrograms(){return ls('power_programs')||[makeTrainingPlanProg()]}
function savePrograms(p){ss('power_programs',p)}
function getActiveProgramId(){return localStorage.getItem('power_active_program')||'training_plan'}
function getActiveProgram(){
  const id=getActiveProgramId();
  const progs=getPrograms();
  return progs.find(p=>p.id===id)||progs[0];
}

// Namespaced storage for active program
const lsp=(key,d={})=>{const v=localStorage.getItem(getActiveProgramId()+'_'+key);try{return v!==null?JSON.parse(v):d}catch{return d}};
const ssp=(key,val)=>localStorage.setItem(getActiveProgramId()+'_'+key,JSON.stringify(val));
const lspFor=(pid,key,d={})=>{const v=localStorage.getItem(pid+'_'+key);try{return v!==null?JSON.parse(v):d}catch{return d}};

// ── WEEK DATE SYNC ────────────────────────────────────
// Store a start-date per program so the week number auto-advances each
// calendar week without any manual arrow pressing.
function ensureStartDate(){
  if(lsp('startDate',null)!==null)return;
  // Anchor start so calcCurrentWeek() returns curWk for this calendar week.
  const now=new Date();
  const thisMon=new Date(now);
  thisMon.setDate(now.getDate()-((now.getDay()+6)%7));
  thisMon.setHours(0,0,0,0);
  ssp('startDate',thisMon.getTime()-(curWk-1)*7*24*60*60*1000);
}

function calcCurrentWeek(){
  const startTs=lsp('startDate',null);
  if(startTs===null)return curWk;
  const thisMon=new Date();
  thisMon.setDate(thisMon.getDate()-((thisMon.getDay()+6)%7));
  thisMon.setHours(0,0,0,0);
  return Math.max(1,Math.round((thisMon.getTime()-startTs)/(7*24*60*60*1000))+1);
}

function switchProgram(id){
  localStorage.setItem(getActiveProgramId()+'_lastWeek',String(curWk));
  localStorage.setItem('power_active_program',id);
  const lw=parseInt(localStorage.getItem(id+'_lastWeek')||'1');
  curWk=lw>=1?lw:1;
  ensureStartDate();
  curWk=calcCurrentWeek();
  showScr('week');
}

function deleteProgram(id){
  if(id===getActiveProgramId()){alert('Cannot delete the active program. Switch to another program first.');return}
  if(!confirm('Delete this program and all its progress data? This cannot be undone.'))return;
  const progs=getPrograms().filter(p=>p.id!==id);
  savePrograms(progs);
  ['completedDays','exerciseChecks','exerciseNotes','dayNotes','lastWeek','startDate'].forEach(k=>{
    localStorage.removeItem(id+'_'+k);
  });
  renderPrograms();
}

// ── STATE ─────────────────────────────────────────────
let curWk=1,curScr='week',prevScr='week';

// ── STATS ─────────────────────────────────────────────
function calcStats(){
  const c=lsp('completedDays');
  const keys=Object.keys(c);
  const total=keys.length;
  const wkDone=keys.filter(k=>k.startsWith(curWk+'-')).length;
  const sorted=keys.map(k=>{const[w,d]=k.split('-').map(Number);return w*7+d}).sort((a,b)=>a-b);
  let streak=0;
  if(sorted.length){
    streak=1;
    for(let i=sorted.length-1;i>0;i--){
      if(sorted[i]-sorted[i-1]<=2)streak++;else break;
    }
  }
  return{wkDone,streak,total};
}

// ── SCREEN NAV ────────────────────────────────────────
function showScr(name){
  skipRest();
  document.getElementById('scr-day').classList.remove('active');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('scr-'+name).classList.add('active');
  document.getElementById('nb-'+name)?.classList.add('on');
  curScr=name;prevScr=name;
  if(name==='week')renderWeek();
  if(name==='progress')renderProgress();
  if(name==='programs')renderPrograms();
}

function openDay(dayNum){
  prevScr=curScr;
  document.getElementById('scr-'+curScr).classList.remove('active');
  if(getActiveProgram().id==='flat_feet_fix'){
    ffOpenWorkout(dayNum);
    return;
  }
  renderDay(curWk,dayNum);
  document.getElementById('scr-day').classList.add('active');
}
function goBack(){
  document.getElementById('scr-day').classList.remove('active');
  document.getElementById('scr-'+prevScr).classList.add('active');
  if(prevScr==='week')renderWeek();
  if(prevScr==='progress')renderProgress();
}
// ── WEEK RENDER ───────────────────────────────────────
function chWk(d){curWk=Math.max(1,curWk+d);renderWeek()}

function getTodayDow(){
  return['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date().getDay()];
}

function getTodayDayNum(){
  const dow=getTodayDow();
  const day=getActiveProgram().days.find(d=>d.dow===dow);
  return day?day.day:1;
}

function tagClass(t){
  const m={Strength:'s',Cardio:'c',Power:'p',Rest:'r',Recovery:'r',Mobility:'m'};
  return 't'+(m[t]||'r');
}

function renderWeek(){
  const prog=getActiveProgram();
  const days=prog.days;
  document.getElementById('wk-head-name').textContent=prog.name;
  document.getElementById('wk-sub').textContent=prog.subtitle||'7-Day Training Block';
  document.getElementById('wk-lbl').textContent='WEEK '+curWk;
  document.getElementById('wk-prev').disabled=curWk<=1;
  const{wkDone,streak,total}=calcStats();
  document.getElementById('sv-wk').textContent=wkDone;
  document.getElementById('sv-str').textContent=streak;
  document.getElementById('sv-tot').textContent=total;
  const completed=lsp('completedDays');
  const todayDow=getTodayDow();
  const _dowOrd={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};
  const sortedDays=[...days].sort((a,b)=>(_dowOrd[a.dow]??7)-(_dowOrd[b.dow]??7));
  document.getElementById('day-grid').innerHTML=sortedDays.map(d=>{
    if(d.isRest){
      return`<div class="dc rest">
        <div class="dc-dow">${d.dow}</div>
        <div class="dc-n">Day ${d.day}</div>
        <div class="dc-t">${d.title}</div>
        <div class="dc-tags"><span class="tag tr">Rest</span></div>
      </div>`;
    }
    const _st=completed[curWk+'-'+d.day];
    const done=_st==='complete'||_st===true;
    const partialDay=_st==='partial';
    const isToday=d.dow===todayDow;
    const tags=d.tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join('');
    return`<div class="dc${done?' done':''}${partialDay?' partial':''}${isToday?' today':''}" onclick="openDay(${d.day})">
      <div class="dc-dow">${d.dow}</div>
      <div class="dc-n">Day ${d.day}</div>
      <div class="dc-t">${d.title}</div>
      <div class="dc-tags">${tags}</div>
    </div>`;
  }).join('');
}

// ── DAY RENDER ────────────────────────────────────────
function phase(wk){return wk<=3?'BUILD':wk<=6?'LOAD':'EXPRESS'}

function metaStr(ex,wk){
  let m='';
  if(ex.s&&ex.r)m=ex.s+'×'+ex.r;
  else if(ex.s)m=ex.s+' sets';
  if(ex.loads){
    const load=ex.loads[Math.min((wk||1)-1,ex.loads.length-1)];
    m+=(m?' · ':'')+load+'kg';
  }
  if(ex.m)m+=(m?' · ':'')+ex.m;
  return m;
}

function renderDay(wk,dayNum){
  const prog=getActiveProgram();
  const d=prog.days[dayNum-1];
  if(!d)return;
  document.getElementById('d-num').textContent=`Day ${dayNum} — Week ${wk}`;
  document.getElementById('d-title').textContent=d.title;

  if(prog.id==='power_default'){
    document.getElementById('d-phase').innerHTML=
      `<div class="phase"><div class="phase-dot"></div>
       <div class="phase-txt">Phase: <b>${phase(wk)}</b> · Week ${wk}</div></div>`;
  } else {
    document.getElementById('d-phase').innerHTML='';
  }

  const checks=lsp('exerciseChecks');
  const notes=lsp('exerciseNotes');
  const _dayStatus=lsp('completedDays')[`${wk}-${dayNum}`];
  const comp=_dayStatus==='complete'||_dayStatus===true;
  const partialComp=_dayStatus==='partial';
  let idx=0,html='';

  if(comp){
    html+=`<div class="logged-banner">
      <span class="lb-check">✓</span>
      <span class="lb-txt">Session Logged</span>
      <button class="lb-unlog" onclick="togComplete(${wk},${dayNum})">Un-log</button>
    </div>`;
  } else if(partialComp){
    html+=`<div class="logged-banner partial">
      <span class="lb-check partial">~</span>
      <span class="lb-txt partial">Partial Session</span>
      <button class="lb-unlog" onclick="togComplete(${wk},${dayNum})">Un-log</button>
    </div>`;
  }

  if(d.isRest){
    html=`<div class="rest-card">
      <div class="rest-icon">😴</div>
      <div class="rest-title">Full Rest Day</div>
      <div class="rest-sub">Sleep, eat, recover.</div>
    </div>`;
  } else {
    d.secs.forEach(sec=>{
      html+=`<div class="sec-head"><div class="sdot ${sec.type}"></div><div class="sec-lbl">${sec.lbl}</div></div>`;
      sec.exs.forEach(ex=>{
        const i=idx++;
        const ck=!!checks[`${wk}-${dayNum}-${i}`];
        const nt=notes[`${wk}-${dayNum}-${i}`]||'';
        const meta=metaStr(ex,wk);
        html+=`<div class="ex-row" id="er${i}">
          <button class="chk${ck?' on':''}" onclick="togEx(${wk},${dayNum},${i})"></button>
          <div class="ex-info">
            <div class="ex-nm${ck?' done':''}" id="en${i}">${ex.n}</div>
            ${meta?`<div class="ex-mt">${meta}</div>`:''}
            ${ex.rest?`<button class="ex-rest" onclick="startRest(${ex.rest})">${fmtRest(ex.rest)} rest</button>`:''}
            <div class="ex-np" id="ep${i}" style="${nt?'':'display:none'}">${nt}</div>
          </div>
          <button class="notebtn${nt?' has':''}" id="nb${i}" onclick="sheetOpen(${wk},${dayNum},${i})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>`;
      });
    });
    if(d.note)html+=`<div class="pnote">${d.note}</div>`;
  }

  const dn=lsp('dayNotes');
  html+=`<div class="sn-wrap">
    <div class="sn-lbl">Session Notes</div>
    <textarea class="sn-ta" id="sn-ta" placeholder="How did it go…" oninput="saveDayNote(${wk},${dayNum},this.value)">${dn[`${wk}-${dayNum}`]||''}</textarea>
  </div>
  <div class="logwrap">
    <button class="logbtn${comp?' logged':partialComp?' partial':''}" id="log-btn" onclick="togComplete(${wk},${dayNum})">
      ${comp?'✓ SESSION LOGGED':partialComp?'~ PARTIAL SESSION':'LOG SESSION COMPLETE'}
    </button>
  </div>`;

  document.getElementById('d-body').innerHTML=html;
  document.getElementById('scr-day').scrollTop=0;
}

function togEx(wk,day,i){
  const c=lsp('exerciseChecks');
  const v=!c[`${wk}-${day}-${i}`];
  if(v)c[`${wk}-${day}-${i}`]=true;else delete c[`${wk}-${day}-${i}`];
  ssp('exerciseChecks',c);
  document.querySelector(`#er${i} .chk`).classList.toggle('on',v);
  document.getElementById('en'+i).classList.toggle('done',v);
}

function togComplete(wk,day){
  const c=lsp('completedDays');
  const cur=c[`${wk}-${day}`];
  let next;
  if(!cur){next='complete';}
  else if(cur==='complete'||cur===true){next='partial';}
  else{next=null;}
  if(next)c[`${wk}-${day}`]=next;else delete c[`${wk}-${day}`];
  ssp('completedDays',c);
  const isComp=next==='complete';
  const isPart=next==='partial';
  const btn=document.getElementById('log-btn');
  if(btn){
    btn.textContent=isComp?'✓ SESSION LOGGED':isPart?'~ PARTIAL SESSION':'LOG SESSION COMPLETE';
    btn.className='logbtn'+(isComp?' logged':isPart?' partial':'');
  }
  const banner=document.querySelector('.logged-banner');
  if(isComp){
    if(banner){banner.outerHTML=`<div class="logged-banner"><span class="lb-check">✓</span><span class="lb-txt">Session Logged</span><button class="lb-unlog" onclick="togComplete(${wk},${day})">Un-log</button></div>`;}
    else{document.getElementById('d-body').insertAdjacentHTML('afterbegin',`<div class="logged-banner"><span class="lb-check">✓</span><span class="lb-txt">Session Logged</span><button class="lb-unlog" onclick="togComplete(${wk},${day})">Un-log</button></div>`);}
  } else if(isPart){
    if(banner){banner.outerHTML=`<div class="logged-banner partial"><span class="lb-check partial">~</span><span class="lb-txt partial">Partial Session</span><button class="lb-unlog" onclick="togComplete(${wk},${day})">Un-log</button></div>`;}
    else{document.getElementById('d-body').insertAdjacentHTML('afterbegin',`<div class="logged-banner partial"><span class="lb-check partial">~</span><span class="lb-txt partial">Partial Session</span><button class="lb-unlog" onclick="togComplete(${wk},${day})">Un-log</button></div>`);}
  } else if(banner){
    banner.remove();
  }
}

function saveDayNote(wk,day,val){
  const n=lsp('dayNotes');n[`${wk}-${day}`]=val;ssp('dayNotes',n);
}

// ── NOTE SHEET ────────────────────────────────────────
let shCtx=null;

function sheetOpen(wk,day,i){
  const prog=getActiveProgram();
  const d=prog.days[day-1];
  let ex=null,idx=0;
  for(const s of(d.secs||[])){for(const e of s.exs){if(idx===i){ex=e;break}idx++}if(ex)break}
  shCtx={wk,day,i};
  document.getElementById('sh-title').textContent=ex?ex.n:'Exercise Note';
  document.getElementById('sh-in').value=lsp('exerciseNotes')[`${wk}-${day}-${i}`]||'';
  document.getElementById('sheet').classList.add('open');
  setTimeout(()=>document.getElementById('sh-in').focus(),120);
}
function sheetClose(e){
  if(e&&e.target!==document.getElementById('sheet'))return;
  document.getElementById('sheet').classList.remove('open');
  shCtx=null;
}
function sheetSave(){
  if(!shCtx)return;
  const{wk,day,i}=shCtx;
  const val=document.getElementById('sh-in').value.trim();
  const n=lsp('exerciseNotes');
  if(val)n[`${wk}-${day}-${i}`]=val;else delete n[`${wk}-${day}-${i}`];
  ssp('exerciseNotes',n);
  const ep=document.getElementById('ep'+i);
  const nb=document.getElementById('nb'+i);
  if(ep){ep.textContent=val;ep.style.display=val?'':'none'}
  if(nb)nb.classList.toggle('has',!!val);
  document.getElementById('sheet').classList.remove('open');
  shCtx=null;
}

// ── PROGRESS RENDER ───────────────────────────────────
function renderProgress(){renderHeatmap();renderLogs()}

function renderHeatmap(){
  const checks=lsp('exerciseChecks');
  const prog=getActiveProgram();
  const DOW_COL={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};
  const dayToCol={};
  prog.days.forEach(d=>{dayToCol[d.day]=DOW_COL[d.dow]??d.day-1});
  const colToDay={};
  prog.days.forEach(d=>{if(!d.isRest){const col=dayToCol[d.day];if(col!=null)colToDay[col]=d.day;}});

  const labels=['S','M','T','W','T','F','S'];
  let html=labels.map(l=>`<div class="hc hc-lbl">${l}</div>`).join('');
  for(let w=1;w<=10;w++){
    const row=new Array(7).fill(null);
    prog.days.forEach(d=>{
      const col=dayToCol[d.day];
      if(col===undefined)return;
      if(d.isRest){row[col]='';return;}
      let total=0,done=0;
      (d.secs||[]).forEach(sec=>sec.exs.forEach(()=>{
        if(checks[`${w}-${d.day}-${total}`])done++;
        total++;
      }));
      row[col]=total===0?'':(done===total?'complete':done>0?'partial':'');
    });
    row.forEach((st,col)=>{
      if(st===null){html+=`<div class="hc"></div>`;return;}
      const dn=colToDay[col];
      const cls='hc'+(st==='complete'?' done':st==='partial'?' partial':'')+(dn!=null?' hc-tap':'');
      html+=`<div class="${cls}"${dn!=null?` onclick="openDayFromHm(${w},${dn})"`:''}></div>`;
    });
  }
  document.getElementById('heatmap').innerHTML=html;
}

function openDayFromHm(wk,day){curWk=wk;openDay(day);}

function renderLogs(){
  const logs=ls('logs',{});
  document.getElementById('log-secs').innerHTML=METRICS.map(m=>{
    const entries=(logs[m.k]||[]).slice().reverse();
    const rows=entries.length?entries.map((e,ri)=>{
      const realIdx=entries.length-1-ri;
      return`<div class="le">
        <div class="le-v">${e.v}<span class="le-u"> ${m.u}</span></div>
        <div class="le-d">${e.d}</div>
        <div class="le-n">${e.n||''}</div>
        <button class="ldel" onclick="delLog('${m.k}',${realIdx})">×</button>
      </div>`;
    }).join(''):`<div class="le-empty">No entries yet</div>`;
    return`<div class="ls">
      <div class="ls-head"><span class="ls-name">${m.l}</span><span class="ls-unit">${m.u}</span></div>
      <div class="ls-row">
        <input class="li" id="lv-${m.k}" type="number" placeholder="0" step="0.5" inputmode="decimal">
        <input class="ln" id="ln-${m.k}" type="text" placeholder="Note (optional)">
        <button class="ladd" onclick="addLog('${m.k}')">ADD</button>
      </div>
      <div class="le-scroll">${rows}</div>
    </div>`;
  }).join('');
}

function addLog(k){
  const v=parseFloat(document.getElementById('lv-'+k).value);
  if(isNaN(v))return;
  const note=document.getElementById('ln-'+k).value.trim();
  const logs=ls('logs',{});
  if(!logs[k])logs[k]=[];
  const d=new Date();
  logs[k].push({v,n:note,d:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'})});
  ss('logs',logs);
  document.getElementById('lv-'+k).value='';
  document.getElementById('ln-'+k).value='';
  renderLogs();
}
function delLog(k,i){
  const logs=ls('logs',{});
  if(!logs[k])return;
  logs[k].splice(i,1);
  ss('logs',logs);
  renderLogs();
}

  const progs=getPrograms();

      <div class="pc-foot">

// ── PROGRAM EDITOR ────────────────────────────────────
let editData=null;

const DOW_NAMES=['SUN','MON','TUE','WED','THU','FRI','SAT'];

function newProgram(){
  editData={
    id:'prog_'+Date.now(),
    name:'',
    isBuiltIn:false,
    createdAt:Date.now(),
    days:DOW_NAMES.map((dow,i)=>({
      day:i+1,dow,
      isRest:i===3,
      title:i===3?'Full Rest Day':'',
      type:i===3?'rest':'strength',
      tags:i===3?['Rest']:['Strength'],
      note:'',
      exs:[]
    }))
  };
  openProgSheet('NEW PROGRAM');
}

function editProgram(id){
  const prog=getPrograms().find(p=>p.id===id);
  if(!prog)return;
  editData={
    id:prog.id,
    name:prog.name,
    isBuiltIn:prog.isBuiltIn||false,
    createdAt:prog.createdAt||0,
    days:prog.days.map(d=>({
      day:d.day,dow:d.dow,
      isRest:d.isRest||false,
      title:d.title||'',
      type:d.secs&&d.secs[0]?d.secs[0].type:(d.isRest?'rest':'strength'),
      tags:d.tags||[],
      note:d.note||'',
      exs:(d.secs||[]).flatMap(s=>s.exs.map(e=>({
        n:e.n,
        sr:e.s&&e.r?`${e.s}×${e.r}`:e.s?`${e.s} sets`:e.m||''

    }))

  openProgSheet('EDIT PROGRAM');
}

function openProgSheet(title){

function closeProgSheet(){

function renderPsEx(dayIdx,exIdx,ex){
  return`<div class="ps-ex-row" id="pse-${dayIdx}-${exIdx}">
    <input class="ps-ex-n" type="text" placeholder="Exercise name" value="${ex.n||''}"
      oninput="editData.days[${dayIdx}].exs[${exIdx}].n=this.value" autocomplete="off">
    <input class="ps-ex-sr" type="text" placeholder="3×10" value="${ex.sr||''}"
      oninput="editData.days[${dayIdx}].exs[${exIdx}].sr=this.value" autocomplete="off">
    <button class="ps-ex-del" onclick="delPsEx(${dayIdx},${exIdx})">×</button>
  </div>`;
}

function setPsType(idx,type,btn){
  editData.days[idx].type=type;
  btn.closest('.ps-type-row').querySelectorAll('.ps-type').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function addPsEx(idx){
  editData.days[idx].exs.push({n:'',sr:''});
  const newIdx=editData.days[idx].exs.length-1;
  document.getElementById('ps-exs-'+idx).insertAdjacentHTML('beforeend',renderPsEx(idx,newIdx,{n:'',sr:''}));
}

function delPsEx(dayIdx,exIdx){
  editData.days[dayIdx].exs.splice(exIdx,1);
  document.getElementById('ps-exs-'+dayIdx).innerHTML=
    editData.days[dayIdx].exs.map((ex,ei)=>renderPsEx(dayIdx,ei,ex)).join('');
}

function parseSR(sr){
  if(!sr)return{};
  const m=sr.match(/^(\d+)[×x](\d+)/);
  if(m)return{s:parseInt(m[1]),r:parseInt(m[2])};
  const sm=sr.match(/^(\d+)\s*sets?/i);
  if(sm)return{s:parseInt(sm[1])};
  return{m:sr};
}

function saveProgSheet(){
  if(!editData)return;
  const name=document.getElementById('ps-name').value.trim();
  if(!name){alert('Please enter a program name.');return}
  editData.name=name;

  const TYPE_TO_TAG={strength:'Strength',cardio:'Cardio',power:'Power',accessory:'Accessory',core:'Core',rest:'Rest'};

  const savedProg={
    id:editData.id,
    name:editData.name,
    subtitle:editData.isBuiltIn?(getPrograms().find(p=>p.id===editData.id)||{}).subtitle||'':'',
    isBuiltIn:editData.isBuiltIn,
    createdAt:editData.createdAt,
    days:editData.days.map(day=>{
      if(day.isRest){
        return{day:day.day,dow:day.dow,title:'Full Rest Day',tags:['Rest'],isRest:true,note:'Sleep, eat, recover.',secs:[]};
      }
      const validExs=day.exs.filter(e=>e.n&&e.n.trim());
      return{
        day:day.day,dow:day.dow,
        title:day.title||`Day ${day.day}`,
        tags:[TYPE_TO_TAG[day.type]||'Strength'],
        isRest:false,note:day.note||'',
        secs:[{
          type:day.type,
          lbl:TYPE_TO_TAG[day.type]||'Strength',
          exs:validExs.map(e=>({n:e.n.trim(),...parseSR(e.sr)}))
        }]
      };
    })
  };

  const progs=getPrograms();
  const idx=progs.findIndex(p=>p.id===editData.id);
  if(idx>=0)progs[idx]=savedProg;else progs.push(savedProg);
  savePrograms(progs);
  closeProgSheet();
  renderPrograms();
  if(getActiveProgramId()===editData.id)renderWeek();
}

// ── REST TIMER ────────────────────────────────────────
let restTid=null,restSecs=0;
function fmtRest(secs){const m=Math.floor(secs/60),s=secs%60;return`${m}:${String(s).padStart(2,'0')}`}
function startRest(secs){
  if(restTid)clearInterval(restTid);
  restSecs=secs;
  updRest();
  document.getElementById('rest-banner').classList.add('on');
  restTid=setInterval(()=>{
    restSecs--;
    if(restSecs<=0){
      skipRest();
      if(navigator.vibrate)navigator.vibrate([200,100,200]);
    } else {
      updRest();
    }
  },1000);
}
function updRest(){
  const m=Math.floor(restSecs/60),s=restSecs%60;
  document.getElementById('rb-time').textContent=`${m}:${String(s).padStart(2,'0')}`;
}
function skipRest(){
  if(restTid){clearInterval(restTid);restTid=null}
  document.getElementById('rest-banner').classList.remove('on');
}

// ── FLAT FEET FIX ─────────────────────────────────────
let ffExIdx=0;
let ffSetsData=[];
let ffTimerSecs=0;
let ffTimerRunning=false;
let ffTimerTid=null;
let ffDayNum=1;

function ffOpenWorkout(dayNum){
  ffDayNum=dayNum||1;
  ffExIdx=0;
  ffSetsData=FF_EXS.map(ex=>Array(ex.sets).fill(false));
  ffStopTimer();
  document.getElementById('ff-back-lbl').textContent=prevScr==='programs'?'Programs':'Week';
  const c=lsp('completedDays');
  if(c[curWk+'-'+ffDayNum]){
    renderFlatFeetLogged();
  } else {
    renderFlatFeetEx();
  }
  document.getElementById('scr-flatfeet').classList.add('active');
}

function renderFlatFeetLogged(){
  const DOWS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const prog=getActiveProgram();
  const day=prog.days.find(d=>d.day===ffDayNum);
  const dayLabel=day?day.dow:'Day '+ffDayNum;
  document.getElementById('ff-num').textContent='Week '+curWk+' · '+dayLabel;
  document.getElementById('ff-name').textContent='Session Logged';
  document.getElementById('ff-body').innerHTML=`
    <div class="ff-complete">
      <div class="ff-complete-icon">&#x2705;</div>
      <div class="ff-complete-title">ALREADY LOGGED</div>
      <div class="ff-complete-sub">This session is marked complete.</div>
      <div class="logwrap" style="padding:0 0 10px">
        <button class="logbtn" style="background:var(--sf2);color:var(--r);border:1px solid var(--r)" onclick="ffUnlog()">UN-LOG THIS SESSION</button>
      </div>
      <div class="logwrap" style="padding:0">
        <button class="logbtn" onclick="closeFlatFeet()">BACK</button>
      </div>
    </div>`;
  document.getElementById('scr-flatfeet').scrollTop=0;
}

function ffUnlog(){
  const c=lsp('completedDays');
  delete c[curWk+'-'+ffDayNum];
  ssp('completedDays',c);
  renderFlatFeetEx();
}

function ffStartFromPrograms(){
  prevScr=curScr;
  document.getElementById('scr-'+curScr).classList.remove('active');
  ffOpenWorkout(getTodayDayNum());
}

function closeFlatFeet(){
  ffStopTimer();
  document.getElementById('scr-flatfeet').classList.remove('active');
  document.getElementById('scr-'+prevScr).classList.add('active');
  if(prevScr==='week')renderWeek();
  if(prevScr==='programs')renderPrograms();
}

function renderFlatFeetEx(){
  const ex=FF_EXS[ffExIdx];
  const total=FF_EXS.length;
  document.getElementById('ff-num').textContent='Exercise '+(ffExIdx+1)+' of '+total;
  document.getElementById('ff-name').textContent=ex.name;

  ffTimerSecs=ex.timerSecs;
  ffTimerRunning=false;

  const dots=FF_EXS.map((_,i)=>`<div class="ff-dot${i<ffExIdx?' done':i===ffExIdx?' cur':''}"></div>`).join('');

  const setsRow=ffSetsData[ffExIdx].map((done,i)=>`<button class="ff-set-btn${done?' done':''}" onclick="ffToggleSet(${i})">Set ${i+1}${done?' ✓':''}</button>`).join('');

  const meta=[];
  if(ex.sets&&ex.reps)meta.push(ex.sets+'×'+ex.reps+' reps');
  else if(ex.sets)meta.push(ex.sets+' sets');
  meta.push(ex.timerLbl);

  const stepsHtml=ex.steps.map((s,i)=>`<div class="ff-step"><span class="ff-step-n">${i+1}</span><span>${s}</span></div>`).join('');

  const isLast=ffExIdx===total-1;

  document.getElementById('ff-body').innerHTML=`
    <div class="ff-dots">${dots}</div>
    <div class="ff-target">${ex.target}</div>
    <div class="ff-timer-wrap" id="ff-timer-wrap" onclick="ffToggleTimer()">
      <div class="ff-timer-lbl" id="ff-timer-lbl">${ex.timerLbl} · Tap to start</div>
      <div class="ff-timer-val" id="ff-timer-val">${fmtRest(ex.timerSecs)}</div>
      <div class="ff-timer-hint" id="ff-timer-hint">Tap to start</div>
    </div>
    <div class="ff-sets-wrap">
      <div class="ff-sets-lbl">${meta.join(' · ')}</div>
      <div class="ff-sets-row" id="ff-sets-row">${setsRow}</div>
    </div>
    <div class="ff-steps">
      <div class="ff-steps-lbl">How to</div>
      ${stepsHtml}
    </div>
    <div class="ff-tip"><b>Tip:</b> ${ex.tip}</div>
    <div class="logwrap">
      <button class="logbtn" onclick="${isLast?'ffFinish()':'ffNextEx()'}">
        ${isLast?'FINISH SESSION':'NEXT EXERCISE'}
      </button>
    </div>`;
  document.getElementById('scr-flatfeet').scrollTop=0;
}

function ffToggleTimer(){
  if(ffTimerRunning){
    ffTimerRunning=false;
    if(ffTimerTid){clearInterval(ffTimerTid);ffTimerTid=null}
    const wrap=document.getElementById('ff-timer-wrap');
    if(wrap)wrap.classList.remove('running');
    const lbl=document.getElementById('ff-timer-lbl');
    if(lbl)lbl.textContent=FF_EXS[ffExIdx].timerLbl+' · Paused';
    const hint=document.getElementById('ff-timer-hint');
    if(hint)hint.textContent='Tap to resume';
  } else {
    if(ffTimerSecs<=0)ffTimerSecs=FF_EXS[ffExIdx].timerSecs;
    ffTimerRunning=true;
    const wrap=document.getElementById('ff-timer-wrap');
    if(wrap)wrap.classList.add('running');
    const lbl=document.getElementById('ff-timer-lbl');
    if(lbl)lbl.textContent=FF_EXS[ffExIdx].timerLbl+' · Running';
    const hint=document.getElementById('ff-timer-hint');
    if(hint)hint.textContent='Tap to pause';
    ffTimerTid=setInterval(()=>{
      ffTimerSecs--;
      const el=document.getElementById('ff-timer-val');
      if(el)el.textContent=fmtRest(Math.max(0,ffTimerSecs));
      if(ffTimerSecs<=0){
        ffStopTimer();
        if(navigator.vibrate)navigator.vibrate([200,100,200]);
        const l=document.getElementById('ff-timer-lbl');
        if(l)l.textContent=FF_EXS[ffExIdx].timerLbl+' · Done';
        const h=document.getElementById('ff-timer-hint');
        if(h)h.textContent='Tap to restart';
        const w=document.getElementById('ff-timer-wrap');
        if(w)w.classList.remove('running');
      }
    },1000);
  }
}

function ffStopTimer(){
  ffTimerRunning=false;
  if(ffTimerTid){clearInterval(ffTimerTid);ffTimerTid=null}
}

function ffToggleSet(i){
  ffSetsData[ffExIdx][i]=!ffSetsData[ffExIdx][i];
  const btns=document.querySelectorAll('.ff-set-btn');
  if(btns[i]){
    btns[i].classList.toggle('done',ffSetsData[ffExIdx][i]);
    btns[i].textContent='Set '+(i+1)+(ffSetsData[ffExIdx][i]?' ✓':'');
  }
}

function ffNextEx(){
  ffStopTimer();
  if(ffExIdx<FF_EXS.length-1){
    ffExIdx++;
    renderFlatFeetEx();
  }
}

function ffFinish(){
  ffStopTimer();
  const c=lsp('completedDays');
  c[curWk+'-'+ffDayNum]=true;
  ssp('completedDays',c);
  renderFlatFeetComplete();
}

function renderFlatFeetComplete(){
  document.getElementById('ff-num').textContent='Session Complete';
  document.getElementById('ff-name').textContent='FLAT FEET FIX';
  const schedHtml=FF_SCHED.map(s=>`<div class="ff-sched-item"><div class="ff-sched-dot"></div><div class="ff-sched-txt">${s.text}</div></div>`).join('');
  document.getElementById('ff-body').innerHTML=`
    <div class="ff-complete">
      <div class="ff-complete-icon">&#x2705;</div>
      <div class="ff-complete-title">SESSION COMPLETE</div>
      <div class="ff-complete-sub">Great work — your arches will thank you.</div>
      <div class="ff-sched">
        <div class="ff-sched-title">Progression Schedule</div>
        ${schedHtml}
      </div>
      <div class="logwrap" style="padding:0">
        <button class="logbtn" onclick="closeFlatFeet()">BACK TO ${prevScr==='programs'?'PROGRAMS':'WEEK'}</button>
      </div>
    </div>`;
  document.getElementById('scr-flatfeet').scrollTop=0;
}

// ── INIT ──────────────────────────────────────────────
initPrograms();
// Restore last-viewed week for the active program, then auto-advance to
// the real current week based on the phone's date.
const _lw=parseInt(localStorage.getItem(getActiveProgramId()+'_lastWeek')||'1');
curWk=_lw>=1?_lw:1;
ensureStartDate();
curWk=calcCurrentWeek();
renderWeek();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Force the browser to check for a new sw.js on every page load.
    // Without this the browser can delay the check by up to 24 hours.
    reg.update();
  }).catch(()=>{});

  // When a new SW takes over (skipWaiting + clients.claim), reload so the
  // page picks up any changes. Guard against the double-fire that can happen
  // when the very first SW registers on a fresh install.
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!refreshing){ refreshing = true; location.reload(); }
  });
}
</script>
